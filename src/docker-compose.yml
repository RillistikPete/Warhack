name: warhack

services:
  db:
    image: postgres:18
    container_name: warhack-db
    environment:
      POSTGRES_DB: warhack
      POSTGRES_USER: warhack
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dbpassword}
    ports:
      - "5433:5432"
    volumes:
      - warhack-data:/var/lib/postgresql
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U warhack -d warhack"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  warhack-data: